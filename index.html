<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clé en main</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a1d21">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Conteneur principal de l'application -->
  <div class="app-container">

    <!-- En-tête avec titre et bouton d'information -->
    <header class="app-header">
      <div class="logo-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="m14 14-4.5 4.5"/><path d="m18 10-4.5 4.5"/><path d="m6 18 4.5-4.5"/><path d="m10 6 4.5 4.5"/><path d="m12 22 10-10-4.5-4.5-10 10 4.5 4.5Z"/></svg>
        <h1>Clé en main</h1>
      </div>
      <button id="info-btn" aria-label="Informations">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </button>
    </header>

    <!-- Section principale qui change de contenu (Scan / Liste) -->
    <main>
      <!-- Vue du Scanner -->
      <div id="scan-view" class="view active">
        <div class="actions">
          <input id="manual" placeholder="Saisir une adresse..." autocomplete="off">
          <button id="scan">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.7V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2Z"/><path d="M7 12h10"/></svg>
            <span class="scan-text">Scanner</span>
            <span class="stop-text">Arrêter</span>
          </button>
        </div>

        <div id="result">Saisissez ou scannez une adresse</div>

        <div id="camera-container">
          <div id="camera-view">
            <div class="scan-overlay">
              <div class="scan-line"></div>
            </div>
          </div>
          <button id="stop-scan">Arrêter le scan</button>
        </div>
      </div>

      <!-- Vue de la liste "À réimprimer" -->
      <div id="list-view" class="view">
        <!-- Le contenu sera injecté par app.js -->
      </div>
    </main>

    <!-- Barre de navigation inférieure -->
    <nav id="nav">
      <button id="tab-scan" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v4H7z"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M5 21h14"/><path d="M12 7V5c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2"/></svg>
        <span>Scanner</span>
      </button>
      <button id="tab-todo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <span>À réimprimer</span>
      </button>
    </nav>
  </div>

  <!-- Panneau latéral d'informations -->
  <aside id="about">
    <button id="close-about-btn" class="close-btn" aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="about-content">
      <h2>À propos</h2>
      <div id="ver"></div>
      <p class="db-date">BDD à jour au 04.08.2025</p>
      <hr>
      <h3>Historique des versions</h3>
      <div id="history"></div>
      <button id="update">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/></svg>
        <span>Rechercher une mise à jour</span>
      </button>
    </div>
  </aside>
  <div id="about-overlay" class="overlay-backdrop"></div>


  <!-- SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyD_Q-Bx8OHFhQa1X0KWlRNvzOP2c3fgG84",
      authDomain:        "clesfinder.firebaseapp.com",
      projectId:         "clesfinder",
      storageBucket:     "clesfinder.appspot.com",
      messagingSenderId: "447281549352",
      appId:             "1:447281549352:web:abc433220d9a74885d651d"
    });

    firebase.auth().signInAnonymously();
    firebase.firestore().enablePersistence().catch(()=>{});
    window.db = firebase.firestore();
  </script>

  <script src="./quagga.min.js"></script>
  <script src="./app.js"></script>

  <script>
    if ('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW OK', reg))
        .catch(err => console.log('SW KO', err));
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;

      const btn = document.createElement('button');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg><span>Installer l’app</span>`;
      btn.className = 'install-btn banner';
      document.body.appendChild(btn);

      btn.onclick = () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice => {
          if (choice.outcome === 'accepted') btn.remove();
        });
      };
    });
  </script>

  <script>
    if ('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistration().then(reg => {
        if(!reg) return;
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
          });
        });
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
      });
    }

    function showUpdateBanner(){
      const bar = Object.assign(document.createElement('div'), {
        innerHTML : '<span>Nouvelle version disponible</span><button>Recharger</button>',
        className : 'update-banner banner'
      });
      bar.querySelector('button').onclick = () => window.location.reload(true);
      document.body.appendChild(bar);
    }
  </script>
</body>
</html>
